<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cline 代理管理面板</title>
<script>
(function(){try{var t=localStorage.getItem('cline_admin_theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}try{if(localStorage.getItem('cline_admin_nav')==='collapsed')document.documentElement.dataset.nav='collapsed';}catch(e){}})();
</script>
